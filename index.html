<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PeerCam Net</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md glass rounded-2xl p-6 shadow-2xl space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold tracking-tight text-cyan-400">PeerCam Net</h1>
            <p class="text-xs text-gray-400 mt-1">Select any online device to request its camera feed</p>
            <div id="my-identity" class="mt-3 inline-block px-3 py-1.5 bg-cyan-950/60 border border-cyan-500/30 rounded-xl text-cyan-300 font-mono text-xs font-semibold">
                Your ID: Loading...
            </div>
        </div>

        <!-- Lobby View (Device Selector) -->
        <div id="lobby-view" class="space-y-4">
            <div class="space-y-2">
                <p class="text-sm font-medium text-gray-300">Available Online Devices:</p>
                <div id="device-list" class="space-y-2 max-h-72 overflow-y-auto pr-1">
                    <p class="text-xs text-gray-500 text-center py-8">Scanning for online devices...</p>
                </div>
            </div>
        </div>

        <!-- Active Stream View (Viewer) -->
        <div id="viewer-active-view" class="hidden space-y-4">
            <div class="p-2 bg-green-950/40 border border-green-500/30 rounded-xl text-green-400 text-xs font-medium text-center">
                🟢 Streaming Live Camera Feed!
            </div>
            <div class="relative rounded-xl overflow-hidden bg-black aspect-[3/4] border border-white/10 shadow-inner">
                <video id="remoteVideo" autoplay playsinline class="w-full h-full object-cover"></video>
            </div>
            <button onclick="location.reload()" class="w-full py-3 bg-red-600/80 hover:bg-red-600 rounded-xl text-sm font-medium transition">Disconnect</button>
        </div>

        <!-- Active Stream View (Camera Provider) -->
        <div id="camera-active-view" class="hidden space-y-4">
            <div class="p-2 bg-indigo-950/40 border border-indigo-500/30 rounded-xl text-indigo-300 text-xs font-medium text-center">
                🟢 Broadcasting your camera to a remote viewer!
            </div>
            <div class="relative rounded-xl overflow-hidden bg-black aspect-[3/4] border border-white/10 shadow-inner">
                <video id="localVideo" autoplay muted playsinline class="w-full h-full object-cover"></video>
            </div>
            <button onclick="location.reload()" class="w-full py-3 bg-red-600/80 hover:bg-red-600 rounded-xl text-sm font-medium transition">Stop Streaming</button>
        </div>
    </div>

    <!-- Firebase Signaling Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // TODO: Replace with your actual Firebase project credentials
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        const appFB = initializeApp(firebaseConfig);
        const db = getFirestore(appFB);

        const pcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun.stunprotocol.org:3478' }
            ]
        };

        // Fun, regular word combinations instead of robotic tech names
        const adjectives = ["Happy", "Brave", "Lucky", "Silly", "Cool", "Fast", "Super", "Clever", "Wild", "Sunny", "Mighty", "Quick"];
        const nouns = ["Potato", "Turtle", "Monkey", "Pancake", "Rocket", "Ninja", "Wizard", "Cookie", "Bandit", "Panda", "Shark", "Dragon"];
        const regularCodename = `${adjectives[Math.floor(Math.random() * adjectives.length)]}-${nouns[Math.floor(Math.random() * nouns.length)]}-${Math.floor(10 + Math.random() * 90)}`;

        class PeerCamNetApp {
            constructor() {
                this.deviceId = 'dev_' + regularCodename.toLowerCase();
                this.deviceName = regularCodename;
                this.pc = null;
                this.localStream = null;
                this.lobbyUnsubscribe = null;
                this.callUnsubscribe = null;
                
                document.getElementById('my-identity').innerText = `Your Device: ${this.deviceName}`;
                this.initApp();
            }

            async initApp() {
                const deviceRef = doc(db, 'devices', this.deviceId);
                await setDoc(deviceRef, {
                    id: this.deviceId,
                    name: this.deviceName,
                    status: 'online',
                    lastSeen: Date.now()
                });

                this.startLobbyListener();
                this.listenForIncomingCalls();
            }

            startLobbyListener() {
                this.lobbyUnsubscribe = onSnapshot(collection(db, 'devices'), (snapshot) => {
                    const listEl = document.getElementById('device-list');
                    listEl.innerHTML = '';
                    let foundOthers = false;

                    snapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        if (data.id === this.deviceId) return; // Skip self

                        foundOthers = true;
                        listEl.innerHTML += `
                            <div class="flex items-center justify-between p-3.5 bg-black/40 border border-white/10 rounded-xl">
                                <div>
                                    <p class="text-sm font-semibold text-white">📱 ${data.name}</p>
                                    <p class="text-[10px] text-cyan-400">Online & Ready</p>
                                </div>
                                <button onclick="app.connectToDevice('${data.id}', '${data.name}')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-xs font-semibold transition active:scale-95 shadow-lg">View Camera</button>
                            </div>
                        `;
                    });

                    if (!foundOthers) {
                        listEl.innerHTML = `<p class="text-xs text-gray-500 text-center py-8">No other devices online yet. Open this link on a second device or phone!</p>`;
                    }
                });
            }

            async connectToDevice(targetId, targetName) {
                if (this.lobbyUnsubscribe) this.lobbyUnsubscribe();

                document.getElementById('lobby-view').classList.add('hidden');
                document.getElementById('viewer-active-view').classList.remove('hidden');

                this.pc = new RTCPeerConnection(pcConfig);
                
                this.pc.ontrack = (event) => {
                    document.getElementById('remoteVideo').srcObject = event.streams[0];
                };

                const sessionDocRef = doc(db, 'calls', this.deviceId + '_to_' + targetId);
                const offerCandidates = [];

                this.pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        offerCandidates.push(event.candidate.toJSON());
                    }
                };

                const offerDescription = await this.pc.createOffer();
                await this.pc.setLocalDescription(offerDescription);

                await setDoc(sessionDocRef, {
                    viewerId: this.deviceId,
                    targetCameraId: targetId,
                    offer: { sdp: offerDescription.sdp, type: offerDescription.type },
                    offerCandidates
                });

                this.callUnsubscribe = onSnapshot(sessionDocRef, async (snapshot) => {
                    const data = snapshot.data();
                    if (!this.pc.currentRemoteDescription && data?.answer) {
                        await this.pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                    }
                    if (data?.answerCandidates) {
                        data.answerCandidates.forEach(async (candidate) => {
                            try {
                                await this.pc.addIceCandidate(new RTCIceCandidate(candidate));
                            } catch (e) { console.error(e); }
                        });
                    }
                });
            }

            listenForIncomingCalls() {
                onSnapshot(collection(db, 'calls'), async (snapshot) => {
                    snapshot.forEach(async (docSnap) => {
                        const data = docSnap.data();
                        if (data.targetCameraId === this.deviceId && !this.pc) {
                            
                            try {
                                this.localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                            } catch (err) {
                                alert('Camera permission is required to stream when selected.');
                                return;
                            }

                            if (this.lobbyUnsubscribe) this.lobbyUnsubscribe();
                            document.getElementById('lobby-view').classList.add('hidden');
                            document.getElementById('camera-active-view').classList.remove('hidden');
                            document.getElementById('localVideo').srcObject = this.localStream;

                            this.pc = new RTCPeerConnection(pcConfig);
                            this.localStream.getTracks().forEach((track) => this.pc.addTrack(track, this.localStream));

                            const answerCandidates = [];
                            this.pc.onicecandidate = (event) => {
                                if (event.candidate) {
                                    answerCandidates.push(event.candidate.toJSON());
                                }
                            };

                            await this.pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                            const answerDescription = await this.pc.createAnswer();
                            await this.pc.setLocalDescription(answerDescription);

                            const sessionDocRef = doc(db, 'calls', docSnap.id);
                            await updateDoc(sessionDocRef, {
                                answer: { type: answerDescription.type, sdp: answerDescription.sdp },
                                answerCandidates
                            });

                            if (data.offerCandidates) {
                                data.offerCandidates.forEach(async (candidate) => {
                                    try {
                                        await this.pc.addIceCandidate(new RTCIceCandidate(candidate));
                                    } catch (e) { console.error(e); }
                                });
                            }
                        }
                    });
                });
            }
        }

        window.app = new PeerCamNetApp();
    </script>
</body>
</html>
